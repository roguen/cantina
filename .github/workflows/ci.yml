name: CI

# push is filtered to main so a pull-request branch runs CI once, through the
# pull_request event, instead of twice for every save-point push (audit D-021).
# Post-merge main verification still runs through the push event.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build
      - name: Run deterministic theater harness
        run: dotnet run --project tools/Cantina.TestHarness/Cantina.TestHarness.csproj --configuration Release --no-build -- run all

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cantina-client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/cantina-client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test behavior
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Allow development-branch pushes
        shell: bash
        run: |
          printf '%s\n' 'refs/heads/codex/example 1111111111111111111111111111111111111111 refs/heads/codex/example 0000000000000000000000000000000000000000' |
            .githooks/pre-push origin https://github.com/roguen/cantina.git
      - name: Reject direct main pushes
        shell: bash
        run: |
          if printf '%s\n' 'refs/heads/main 1111111111111111111111111111111111111111 refs/heads/main 0000000000000000000000000000000000000000' |
            .githooks/pre-push origin https://github.com/roguen/cantina.git
          then
            echo 'The pre-push guard accepted a direct main update.' >&2
            exit 1
          fi

  publish-windows:
    name: Publish Windows artifact
    needs: [server, client]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/cantina-client/package-lock.json
      # Barkeep serves the iPad its own client, so the artifact is only complete with the
      # bundle in it (D-026). The client job proves the client; this one ships it.
      - name: Build the iPad client
        working-directory: src/cantina-client
        run: |
          npm ci
          npm run build
      - name: Restore locked Windows dependencies
        run: dotnet restore src/Cantina.Barkeep/Cantina.Barkeep.csproj --runtime win-x64 --locked-mode
      - name: Publish self-contained Barkeep
        run: dotnet publish src/Cantina.Barkeep/Cantina.Barkeep.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/barkeep-win-x64
      - name: Strip non-deployment files from the artifact
        # The artifact is public. Debug symbols and the Development settings file are
        # not part of the deployment and were shipping in it (audit D-021).
        shell: pwsh
        run: |
          Remove-Item artifacts/barkeep-win-x64/*.pdb -ErrorAction Stop
          Remove-Item artifacts/barkeep-win-x64/appsettings.Development.json -ErrorAction Stop
          if (-not (Test-Path artifacts/barkeep-win-x64/wwwroot/index.html)) {
            throw 'The artifact has no client bundle; the iPad would have nothing to install.'
          }
      - name: Upload Barkeep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: barkeep-win-x64
          path: artifacts/barkeep-win-x64
          if-no-files-found: error

  regression-gate:
    name: Regression gate
    if: always()
    needs: [server, client, repository-policy, publish-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression dependency
        shell: bash
        env:
          SERVER_RESULT: ${{ needs.server.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          REPOSITORY_POLICY_RESULT: ${{ needs.repository-policy.result }}
          WINDOWS_ARTIFACT_RESULT: ${{ needs.publish-windows.result }}
        run: |
          for result in \
            "$SERVER_RESULT" \
            "$CLIENT_RESULT" \
            "$REPOSITORY_POLICY_RESULT" \
            "$WINDOWS_ARTIFACT_RESULT"
          do
            if [ "$result" != 'success' ]; then
              echo "Regression dependency finished with: $result" >&2
              exit 1
            fi
          done
