name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build

  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/cantina-client
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/cantina-client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test behavior
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  publish-windows:
    name: Publish Windows artifact
    needs: [server, client]
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked Windows dependencies
        run: dotnet restore src/Cantina.Barkeep/Cantina.Barkeep.csproj --runtime win-x64 --locked-mode
      - name: Publish self-contained Barkeep
        run: dotnet publish src/Cantina.Barkeep/Cantina.Barkeep.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output artifacts/barkeep-win-x64
      - name: Upload Barkeep
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: barkeep-win-x64
          path: artifacts/barkeep-win-x64
          if-no-files-found: error
